name: App opportunity
description: An idea to run through Stage 0
labels: [opportunity]
body:
  - type: input
    id: name
    attributes: { label: Working name }
    validations: { required: true }
  - type: textarea
    id: pitch
    attributes: { label: One-paragraph pitch, description: Who, what job, why now }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Any evidence so far, description: Links to competitors, reviews, threads }
