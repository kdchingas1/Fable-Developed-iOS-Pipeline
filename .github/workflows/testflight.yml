name: TestFlight

on:
  push:
    tags: ["beta-*"]
  workflow_dispatch:
    inputs:
      external:
        description: Distribute to external testers
        type: boolean
        default: false

jobs:
  beta:
    runs-on: macos-latest
    timeout-minutes: 60
    environment: testflight
    env:
      APP_PROJECT_DIR: ${{ vars.APP_PROJECT_DIR || 'app' }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      TESTFLIGHT_EXTERNAL: ${{ inputs.external || 'false' }}
      TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS }}
      CI: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec fastlane beta
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/*.ipa
