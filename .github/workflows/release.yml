name: App Store release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: app-store
    env:
      APP_PROJECT_DIR: ${{ vars.APP_PROJECT_DIR || 'app' }}
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ITC_TEAM_ID: ${{ secrets.ITC_TEAM_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - run: brew install xcodegen
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Metadata limits
        run: ./scripts/metadata-lint.sh
      - name: Screenshots
        run: bundle exec fastlane screenshots
      - name: Release
        run: bundle exec fastlane release
      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: build/*.ipa
